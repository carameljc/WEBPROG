<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>GPdI Bethlehem - Daftar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
            <h1 class="h4 card-title text-center mb-4">Daftar Akun Baru</h1>
            
            <div id="status-message" class="alert d-none" role="alert"></div>

            <form id="register-form" action="/api/auth/register" method="POST">
                
                <div class="mb-3">
                    <input type="text" name="nama_lengkap" placeholder="Nama Lengkap" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <input type="text" name="username" placeholder="Username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <input type="password" name="password" id="password" placeholder="Password" class="form-control" required>
                    <small class="form-text text-muted">Min. 8 karakter, harus mengandung: huruf besar, huruf kecil, angka, dan simbol underscore (_).</small>
                </div>
                
                <div class="mb-3">
                    <input type="password" name="retype_password" id="retype_password" placeholder="Ulangi Password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Daftar</button>
            </form>
            
            <p class="text-center mt-3">Sudah punya akun? <a href="/login.html">Login di sini</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

    <script src="/js/register.js"></script>
</body>
</html>
