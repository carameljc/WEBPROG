<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPdI Bethlehem - Galeri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header></header>
    
    <!-- Header dengan container -->
    <div class="container py-4">
        <h2 class="text-center mt-3 mb-3">Galeri Foto & Video</h2>
        <p class="lead text-center mb-5">Dokumentasi kegiatan dan acara yang telah berlangsung.</p>
    </div>
    
    <!-- Gallery full width -->
    <div class="gallery-full-width">
        <div id="gallery-container" class="gallery-grid grid-4-col">
            <p class="loading-text">Memuat galeri...</p>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="gallery-modal" class="modal-overlay">
        <span class="modal-close" id="modal-close-btn">&times;</span>
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

    <script src="/js/main.js"></script>
    <script src="/js/galeri.js"></script>
</body>
</html>
