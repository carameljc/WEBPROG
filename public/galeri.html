<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPdI Bethlehem - Admin Galeri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header></header>
    
    <main class="container py-4">
        <!-- Page Header dengan gradient -->
        <div class="admin-page-header mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h2><i class="fas fa-images me-2"></i>Galeri Gereja (Admin)</h2>
                <a href="/index.html" class="btn btn-back">
                    <i class="fas fa-arrow-left me-2"></i>Kembali ke Beranda
                </a>
            </div>
        </div>
        
        <!-- Upload Section -->
        <div class="card border-0 shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-cloud-upload-alt me-2"></i>Unggah Foto/Video Baru</h4>
            </div>
            <div class="card-body">
                <form id="upload-form" enctype="multipart/form-data" class="row g-3">
                    <div class="col-12">
                        <div class="mb-3">
                            <label for="mediaFile" class="form-label fw-semibold">
                                <i class="fas fa-file-upload me-2"></i>Pilih File
                            </label>
                            <div class="input-group">
                                <input type="file" id="mediaFile" name="mediaFile" 
                                       accept="image/*,video/*" class="form-control" required>
                                <span class="input-group-text">
                                    <i class="fas fa-image"></i>
                                </span>
                            </div>
                            <div class="form-text">
                                Ukuran maksimal: 10MB. Format: JPG, PNG, GIF, MP4, MOV
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="event_name" class="form-label fw-semibold">
                                <i class="fas fa-calendar-alt me-2"></i>Nama Acara
                            </label>
                            <input type="text" id="event_name" name="event_name" 
                                   placeholder="Contoh: Natal 2024" class="form-control">
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="caption" class="form-label fw-semibold">
                                <i class="fas fa-comment me-2"></i>Keterangan
                            </label>
                            <textarea id="caption" name="caption" 
                                      placeholder="Deskripsi singkat..." 
                                      class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    
                    <div class="col-12 mt-2">
                        <button type="submit" class="btn btn-primary btn-lg w-100 py-2">
                            <i class="fas fa-upload me-2"></i>
                            <span class="upload-text">Unggah Media</span>
                            <span class="loading-spinner" style="display: none;"></span>
                        </button>
                    </div>
                </form>
                
                <div id="upload-status" class="mt-3"></div>
            </div>
        </div>

        <!-- Current Gallery Section -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-photo-video me-2"></i>Galeri Saat Ini</h4>
            </div>
            <div class="card-body">
                <!-- Loading state -->
                <div id="gallery-loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Memuat galeri...</p>
                </div>
                
                <!-- Empty state (akan ditampilkan jika kosong) -->
                <div id="empty-gallery" class="empty-gallery-state" style="display: none;">
                    <i class="fas fa-images fa-3x mb-3"></i>
                    <p class="fs-5">Belum ada media di galeri</p>
                    <p class="text-muted">Mulai dengan mengunggah foto atau video pertama Anda</p>
                </div>
                
                <!-- Gallery Grid -->
                <div id="admin-gallery-container" class="row g-4" style="display: none;">
                    <!-- Items akan dimuat di sini -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal untuk preview -->
    <div id="gallery-modal" class="modal-overlay">
        <span class="modal-close" id="modal-close-btn">&times;</span>
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

    <script src="/js/authCheck.js"></script>
    <script src="/js/galleryAdmin.js"></script>
</body>
</html>
