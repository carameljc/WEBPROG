<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPdI Bethlehem - Galeri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <style>
        body.galeri-dark {
            background: #1a052e;
        }
        
        .galeri-dark .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .galeri-dark .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(189, 129, 246, 0.7);
        }
    </style>
</head>
<body class="galeri-dark">
    <header></header>
    
    <div class="hero-banner">
        <img src="/Foto/Welcome.jpg" alt="Welcome to GPdI Bethlehem">
    </div>
    
    <h2 class="text-center mt-3 mb-3 text-white">Galeri Foto & Video</h2>
    <p class="lead text-center mb-5 text-white">Dokumentasi kegiatan dan acara yang telah berlangsung.</p>
    
    <div class="gallery-full-width">
        <div id="gallery-container" class="gallery-grid grid-3-col">
            <p class="loading-text text-white">Memuat galeri...</p>
        </div>

        <div id="pagination-container" class="d-flex justify-content-center mt-4 mb-4 gap-2"></div>
    </div>

    <div id="gallery-modal" class="modal-overlay">
        <span class="modal-close" id="modal-close-btn">&times;</span>
        <div class="modal-content" id="modal-content"></div>
    </div>
    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

    <script src="/js/main.js"></script>
    <script src="/js/galeri.js"></script>
</body>
</html>
