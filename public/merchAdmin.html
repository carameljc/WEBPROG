<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Stok Merchandise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/authCheck.js"></script>
</head>
<body>
    <header></header>
    <main class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📦 Manajemen Stok Merchandise</h2>
            <a href="/index.html" class="btn btn-secondary">← Kembali ke Home</a>
        </div>
        
        <div id="merchStatusMessage" class="alert d-none" role="alert"></div>

        <button id="show-add-form-btn" class="btn btn-success mb-4">
            + Tambah Produk Baru
        </button>
        
        <div id="form-merch-container" class="card p-4 mb-4" style="display:none;">
            <h3 id="form-title" class="card-title">Tambah Produk Baru</h3>
            <form id="merch-form" class="row g-3" enctype="multipart/form-data"> 
                <input type="hidden" name="id" id="merch-id">
                
                <div class="col-md-6">
                    <label for="name" class="form-label">Nama Produk:</label>
                    <input type="text" name="name" id="name" class="form-control" required>
                </div>
                
                <div class="col-md-6">
                    <label for="price" class="form-label">Harga (Rp):</label>
                    <input type="number" name="price" id="price" min="1" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="stock" class="form-label">Stok Awal / Saat Ini:</label>
                    <input type="number" name="stock" id="stock" min="0" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="imageFile" class="form-label">Gambar Produk:</label>
                    <input type="file" name="imageFile" id="imageFile" accept="image/*" class="form-control">
                    <small id="imageHelp" class="form-text text-muted"></small>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary me-2">Simpan Produk</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-danger">Batal</button>
                </div>
            </form>
        </div>
        
        <hr>

        <div class="table-responsive">
            <table class="table table-hover table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Gambar</th>
                        <th>Nama Produk</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="merch-table-body">
                    <tr><td colspan="5" class="text-center">Memuat data produk...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/js/merchAdmin.js"></script>
</body>
</html>
