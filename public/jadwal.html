<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>GPdI Bethlehem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header></header>
    <main class="container">
        <div class="page-header">
            <h2>Jadwal Ibadah Rutin</h2>
            <p>Berikut adalah jadwal ibadah mingguan di gereja kami.</p>
        </div>

        <div class="card-grid">
            <div class="jadwal-card">
                <h3>Ibadah Minggu Pagi</h3>
                <p class="jadwal-info">Minggu, 08:00 WIB</p>
            </div>

            <div class="jadwal-card">
                <h3>Ibadah Minggu Siang</h3>
                <p class="jadwal-info">Minggu, 11:00 WIB</p>
            </div>

            <div class="jadwal-card">
                <h3>Ibadah Pemuda</h3>
                <p class="jadwal-info">Sabtu, 18:00 WIB</p>
            </div>

            <div class="jadwal-card">
                <h3>Persekutuan Doa</h3>
                <p class="jadwal-info">Rabu, 19:00 WIB</p>
            </div>
            
            </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    
    <script src="/js/main.js"></script>
</body>
</html>
