<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>GPdI Bethlehem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page">
    <header></header>
    <main class="container" style="margin-top: 130px;">

        <div id="jemaat-view" style="display: none;">
            <h2>Sampaikan Kritik & Saran Anda</h2>
            <p>Masukan Anda sangat berharga bagi kami untuk menjadi lebih baik. Masukan yang Anda kirim bersifat anonim.</p>
            <form id="form-kritik">
                <textarea name="isi_saran" rows="8" placeholder="Tuliskan masukan Anda di sini..." required></textarea>
                <button type="submit">Kirim Masukan</button>
            </form>
            <div id="pesan-sukses" style="color: green; margin-top: 1rem;"></div>
        </div>

        <div id="admin-view" style="display: none;" class="py-4">
            <h2>Daftar Masukan dari Jemaat</h2>
            <div id="list-kritik">
                <p>Memuat data...</p>
            </div>
        </div>

    </main>
    <footer id="jemaat-view"></footer>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script src="/js/main.js"></script>

    <script src="/js/main.js"></script>
    <script src="/js/kritik.js"></script>
</body>
</html>
