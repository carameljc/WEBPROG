<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPdI Bethlehem - Tambah Event</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <header></header>

    <main class="container py-4"> 
        <h1 class="mb-4">🕊️ Tambah Event Gereja</h1>

        <div id="statusMessage" class="alert alert-info" role="alert" style="display: none;"></div>
        
        <form id="eventForm" action="/api/event/tambah" method="POST" enctype="multipart/form-data" class="row g-3">
            
            <div class="col-md-12">
                <label for="nama_event" class="form-label">Nama Event:</label>
                <input type="text" id="nama_event" name="nama_event" class="form-control" required />
            </div>

            <div class="col-md-6">
                <label for="poster" class="form-label">Poster Event:</label>
                <input type="file" id="poster" name="poster" accept="image/*" class="form-control" required />
            </div>

            <div class="col-md-6">
                <label for="link_gform" class="form-label">Link Google Form:</label>
                <input type="url" id="link_gform" name="link_gform" class="form-control" required />
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary">Tambah Event</button>
            </div>
        </form>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('eventForm');
        const statusMessage = document.getElementById('statusMessage');

        const showStatus = (message, type) => {
            // Gunakan class Bootstrap untuk styling
            let className = '';
            if (type === 'success') {
                className = 'alert-success'; 
            } else if (type === 'error') {
                className = 'alert-danger';
            } else { // Loading
                className = 'alert-warning';
            }
            
            statusMessage.className = `alert ${className}`;
            statusMessage.innerHTML = message;
            statusMessage.style.display = 'block';

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            // ***** PERBAIKAN: MENAMBAH KONFIRMASI WAJIB UAS *****
            const eventNameInput = document.getElementById('nama_event').value;
            if (!confirm(`Yakin ingin menambahkan event: "${eventNameInput}"?`)) {
                showStatus('Proses penambahan event dibatalkan.', 'alert-secondary'); // Menggunakan alert-secondary untuk info
                return; 
            }
            // *************************************************

            showStatus('⏳ Sedang memproses... Tunggu sebentar.', 'loading');

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                });
                
                // Coba parse body respons, tapi pastikan tidak kosong
                const contentType = response.headers.get("content-type");
                let result = {};
                
                if (contentType && contentType.includes("application/json")) {
                    result = await response.json();
                }

                if (response.ok) {
                    const eventName = result.nama_event || result.message || 'Event Baru';
                    showStatus(`✅ Event **${eventName}** berhasil ditambahkan!`, 'success');
                    form.reset();
                } else {
                    const errorMessage = result.message || `ERROR: Gagal menambahkan event. Status ${response.status}.`;
                    showStatus(`❌ ${errorMessage}`, 'error');
                }

            } catch (error) {
                console.error('Error saat submit (Network/Parse):', error);
                showStatus('❌ ERROR JARINGAN: Gagal terhubung atau terjadi kesalahan pemrosesan.', 'error');
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    
<script src="/js/main.js"></script> 
</body>
</html>
