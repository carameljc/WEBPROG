<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPdI Bethlehem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-light">

    <header></header>

    <div class="hero-event">
        <div class="hero-overlay"></div>
    </div>

    <main class="container content-container">
        <div class="row align-items-end mb-5">
            <div class="col-md-7">
                <h2 class="section-title">GPDI BETHLEHEM</h2>
                <p class="section-subtitle">Daftar event yang akan datang dan dapat Anda ikuti.</p>
            </div>
            <div class="col-md-5">
                <form id="searchForm" class="d-flex" onsubmit="event.preventDefault(); window.searchEvents();">
                    <input id="searchInput" class="form-control me-2 shadow-sm" type="search" placeholder="Cari Event...">
                    <button class="btn btn-cari" type="submit">Cari</button>
                </form>
            </div>
        </div>
        
        <h4 class="event-heading">Event Aktif</h4>
        <div id="eventCardContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            </div>
    </main>
    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script> 
    <script src="/js/event.js"></script>
</body>
</html>
