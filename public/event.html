<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPdI Bethlehem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>📅 Daftar Event Gereja</h1>
        </div>

        <form id="searchForm" class="d-flex mb-4" onsubmit="event.preventDefault(); searchEvents();">
            <input 
                id="searchInput"
                class="form-control me-2" 
                type="search" 
                placeholder="Cari Event Berdasarkan Judul..." 
                aria-label="Search"
            >
            <button class="btn btn-outline-success" type="submit">Cari</button>
        </form>
        <div class="event-actions admin-only" style="margin-bottom: 2rem;">
            <a href="/eventAdmin.html" class="btn-tambah">+ Tambah Event Baru</a>
        </div>

        <section id="daftar-event-container">
            <div id="eventList" class="event-list">
                <p>Sedang memuat event...</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

    <script src="/js/main.js"></script>
    <script src="/js/event.js"></script> 
  </body>
</html>
