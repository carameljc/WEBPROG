<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Merchandise - GPdI Bethlehem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="/js/authCheck.js"></script>
</head>
<body>
    <header>
        </header>

    <main class="container py-4">
        <h2 class="mb-4">🛍️ Toko Merchandise</h2>
        <p class="text-muted">Dapatkan *merchandise* eksklusif kami di sini!</p>
        
        <div id="merchandiseList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <p class="text-center w-100">Memuat daftar produk...</p>
        </div>
        
        <div id="statusMessage" class="alert alert-info d-none mt-4" role="alert"></div>
    </main>

    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="checkoutModalLabel">Konfirmasi Pembelian</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="checkoutForm">
                    <input type="hidden" id="checkoutProductId" name="product_id">
                    <input type="hidden" id="checkoutPriceAtSale" name="price_at_sale">
                    <h6 class="mb-3">Produk: <span id="checkoutProductName"></span></h6>
                    
                    <div class="mb-3">
                        <label for="checkoutQuantity" class="form-label">Jumlah Beli</label>
                        <input type="number" class="form-control" id="checkoutQuantity" name="quantity" min="1" required>
                    </div>
                    <p class="text-muted">Total Bayar: Rp <span id="checkoutTotalAmount">0</span></p>
                    <button type="submit" class="btn btn-success w-100">Proses Pembayaran</button>
                </form>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    
    <script src="/js/main.js"></script> 
    <script src="/js/merchandise.js"></script> </body>
</html>
