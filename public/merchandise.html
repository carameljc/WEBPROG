<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Merchandise - GPdI Bethlehem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="/js/authCheck.js"></script>
</head>
<body>
    <header>
        </header>

    <main class="container py-4">
        <h2 class="mb-4">🛍️ Toko Merchandise</h2>
        <p class="text-muted">Dapatkan *merchandise* eksklusif kami di sini!</p>
        
        <div id="merchandiseList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <p class="text-center w-100">Memuat daftar produk...</p>
        </div>
        
        <div id="statusMessage" class="alert alert-info d-none mt-4" role="alert"></div>
    </main>
    <footer></footer>

    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Konfirmasi Pembelian & Pengiriman</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="checkoutForm">
                        <input type="hidden" id="checkoutProductId" name="product_id">
                        <input type="hidden" id="checkoutPriceAtSale" name="price_at_sale">
                        
                        <h6 class="fw-bold">Produk: <span id="checkoutProductName"></span></h6>
                        
                        <div class="mb-3">
                            <label class="form-label">Jumlah Beli</label>
                            <input type="number" class="form-control" id="checkoutQuantity" name="quantity" min="1" value="1" required>
                        </div>

                        <hr>
                        <h6 class="fw-bold">Data Penerima</h6>
                        <div class="mb-2">
                            <input type="text" class="form-control" id="customerName" placeholder="Nama Penerima" required>
                        </div>
                        <div class="mb-2">
                            <input type="tel" class="form-control" id="customerPhone" placeholder="Nomor HP Penerima" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="customerAddress" placeholder="Alamat Lengkap Tujuan" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipe Pengiriman</label>
                            <select id="shippingMode" class="form-select">
                                <option value="pribadi">Dikirim Pribadi (Ongkir Rp 10.000)</option>
                                <option value="hadiah">Sebagai Hadiah (Ongkir Rp 20.000)</option>
                            </select>
                        </div>

                        <div class="p-3 bg-light rounded">
                            <div class="d-flex justify-content-between">
                                <span>Subtotal:</span>
                                <span id="displaySubtotal">Rp 0</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Ongkir:</span>
                                <span id="displayShipping">Rp 10.000</span>
                            </div>
                            <div class="d-flex justify-content-between fw-bold text-success border-top mt-2 pt-2">
                                <span>Total Bayar:</span>
                                <span id="displayTotal">Rp 0</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3">Proses Pembayaran</button>
                    </form>
                </div>
            </div>
        </div>
    </div>                   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    
    <script src="/js/main.js"></script> 
    <script src="/js/merchandise.js"></script> </body>
</html>
