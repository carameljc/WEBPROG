<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Transaksi Persembahan</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/authCheck.js"></script>
</head>
<body>
    <header>
        </header>

    <main class="container py-4">
        <h2 class="mb-4">💰 Input Transaksi Persembahan</h2>

        <div id="statusMessage" class="alert d-none" role="alert"></div>

        <form id="transactionForm">
            <div class="table-responsive mb-3">
                <table id="itemTable" class="table table-bordered table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 70%;">Keterangan Item</th>
                            <th style="width: 20%;">Jumlah (Rp)</th>
                            <th style="width: 10%;">Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="itemTableBody">
                        </tbody>
                </table>
            </div>

            <button type="button" id="addRowBtn" class="btn btn-secondary mb-3">
                + Tambah Baris Item
            </button>
            
            <button type="submit" id="saveTransactionBtn" class="btn btn-primary w-100">
                Simpan Transaksi (1 Klik)
            </button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    
    <script src="/js/main.js"></script> 
    <script src="/js/transaction.js"></script>
</body>
</html>
