<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Transaksi Persembahan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/authCheck.js"></script>
</head>
<body>
    <header></header>
    <main class="container py-4">
        <h2 class="mb-4">Laporan Transaksi Persembahan</h2>

        <form id="reportSearchForm" class="d-flex mb-4 gap-2" onsubmit="event.preventDefault(); loadReport();">
            <input type="text" id="searchInput" class="form-control me-2" placeholder="Cari Berdasarkan Nama User / Total Jumlah..." aria-label="Search">
            <button type="submit" class="btn btn-primary">Cari / Filter</button>
        </form>

        <button class="btn btn-info mb-4" onclick="window.print()">
            🖨️ Print Laporan
        </button>

        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal</th>
                        <th>User Pencatat</th>
                        <th>Total Jumlah</th>
                        <th>Detail</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr><td colspan="5" class="text-center">Memuat data laporan...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/js/report.js"></script> </body>
</html>
