<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Transaksi Persembahan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/authCheck.js"></script>
</head>
<body class="admin-page">
    <header></header>
    <main class="container py-4" style="margin-top: 130px;">
        <h2 class="mb-4">Laporan Transaksi Persembahan</h2>

        <form id="reportSearchForm" class="d-flex mb-4 gap-2" onsubmit="loadReport(event);">
            <input type="text" id="searchInput" class="form-control me-2" placeholder="Cari Berdasarkan Nama User / Total Jumlah..." aria-label="Search">
            <button type="submit" class="btn btn-gradient">Cari / Filter</button>
        </form>

        <div class="d-flex gap-2 mb-4">
            <button class="btn btn-danger" onclick="window.print()">
                🖨️ Print Laporan
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-purple">
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal</th>
                        <th>User Pencatat</th>
                        <th>Total Jumlah</th>
                        <th>Detail</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr><td colspan="5" class="text-center">Memuat data laporan...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal fade" id="transactionDetailModal" tabindex="-1" aria-labelledby="detailModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="detailModalTitle">Detail Transaksi</h5>
                    
                </div>
                <div class="modal-body" id="detailModalBody">
                    <p class="text-center">Memuat...</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/js/main.js"></script>
    <script src="/js/report.js"></script> 
</body>
</html>
